schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), React 19, TypeScript 5.9 (strict), Tailwind CSS 4, PocketBase 0.28.0, pnpm 11 workspace.
  Architecture: App Router pages under app/, shared lib/ (pocketbase client, pocketbase-filter, env, schemas, auth, storage), components/ UI kit (Radix + cva + shadcn-style), zod schemas for validation.
  Testing: Vitest 4 + Testing Library (jsdom) in tests/ + Playwright E2E in e2e/ (local compose); coverage via @vitest/coverage-v8.
  Style: Biome 2.5 (biome check/lint/format), tsc --noEmit typecheck, husky + lint-staged (biome lint --write); no ESLint.
  Conventions: PRD.md / PRODUCT.md / DESIGN.md at repo root; PR review budget 400 lines; conventional commits.

strict_tdd: true

testing:
  runner: pnpm test:run (vitest run)
  layers:
    unit: vitest
    integration: "@testing-library/react + jsdom"
    e2e: Playwright (pnpm test:e2e, compose local)
  coverage:
    available: true
    command: pnpm coverage (vitest run --coverage, provider v8)
  quality:
    linter: pnpm check (biome check --formatter-enabled=false) / pnpm lint (biome lint)
    typecheck: pnpm exec tsc --noEmit
    formatter: biome format (pnpm format)

rules:
  proposal:
    - State intent, scope, and approach; include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: pnpm test:run
  verify:
    test_command: pnpm test:run
    build_command: pnpm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
