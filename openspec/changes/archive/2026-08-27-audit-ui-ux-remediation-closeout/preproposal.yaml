product_decisions: confirmed
product_decisions_detail:
  status: confirmed
  selected_token: "A:enable_configure_batch_atomic"
  selection:
    ordinal: 1
    ordinal_alias: "1"
    canonical_token: "A:enable_configure_batch_atomic"
    mapped_once: true
    interpretation: "enable/configure PocketBase batch and retain atomic service update + lifecycle event writes"
    source: "maintainer single-select answer 1"
  note: "Maintainer selection ordinal 1 mapped exactly once to canonical token A:enable_configure_batch_atomic per closed single-select envelope. No reinterpretation or broadening. Product decisions confirmed; proposal readiness re-evaluated against all other conditions which remain valid."
  options:
    - id: A
      name: enable_configure_batch_atomic
      token: "A:enable_configure_batch_atomic"
      status: selected
      description: "Enable batch in the PocketBase Admin Dashboard settings (per excerpts 1, 4) on the target 0.40.1 deployment and keep POST /api/batch / pb.createBatch().send() for the status/transfer operation (update services + create service_events/service_lifecycle event in one transaction)."
      consequences: "Preserves atomicity — both writes succeed or both roll back within the single batch transaction (C5). Keeps the operation transactional as documented (C5, C6) and avoids compensation logic. Requires Admin access, deployment configuration change, and documentation of the enablement step for all environments (dev/staging/prod). Introduces operational coupling: if batch is disabled on any environment, the feature regresses to 403. Must respect bounded body/processing guidance (C6) — keep batch to exactly the two writes (service update + event create) with small JSON payloads."
      spec_design_if_chosen: "Exact Dashboard setting path and flag; environment matrix for enablement; batch payload shape (update vs. upsert vs. create within POST /api/batch); transactional error mapping (which batch sub-error maps to HTTP 4xx vs. 500 and what client retry is allowed); idempotency on retry; observability (logging the batch idempotency key if any); fallback if batch remains unavailable on a given deployment."
    - id: B
      name: sequential_writes_compensation
      token: "B:sequential_writes_compensation"
      status: rejected
      rejected_reason: "Not selected — maintainer chose A:enable_configure_batch_atomic. Preserved as rejected alternative with prior consequences intact; not deleted."
      description: "Do not rely on POST /api/batch. Use sequential ordinary writes: pb.collection('services').update(id, body) (C7) followed by pb.collection('service_events').create(...). On second-write failure, apply compensation (e.g., revert the service status/location update or mark event as pending and reconcile), or surface partial-success state to the operator."
      consequences: "No Dashboard configuration required; works regardless of batch enablement. Loses single-transaction atomicity — failure between writes leaves service updated without its lifecycle event (or vice versa) unless compensation succeeds. Requires explicit error handling, compensation semantics, and product decision on what \"partial success\" means for audit trail. Bounded processing guidance (C6) still applies to avoid slow external calls, but transactionality is no longer provided by the platform. Simpler operationally, more complex in application logic."
      spec_design_if_chosen: "Exact sequential order (service first vs. event first and why); compensation strategy (automatic revert vs. manual operator reconciliation vs. outbox/pending queue); idempotency keys for retry; how to handle concurrent status/transfer on same service; observability for partial failures; user-facing copy for compensated vs. failed states; test matrix for failure injection on each write."
  common_consequences: "Both must use services tenant isolation and API rules as existing; neither invents a new pipeline. Both must be verified live against PocketBase 0.40.1 after the chosen path is implemented; mocked unit tests alone did not catch the 403 (predecessor verify-report 40/51, 6 failing scenarios). Later spec/design must capture the chosen contract explicitly (batch vs. sequential) and update specs/service-lifecycle, specs/service-events, design.md, and tasks.md with the exact write path, error codes, and rollback semantics. No product choice is made in this research artifact beyond the maintainer selection persisted here."
  next_owner: orchestrator
  next_action: "Persisted — proceed to sdd-propose with selected token A:enable_configure_batch_atomic"
  allowed_answers: ["A:enable_configure_batch_atomic", "B:sequential_writes_compensation"]
