<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- outer shelf frame 8px inset to center 16×16 slot area (2×2 of 8px) -->
  <rect x="8" y="8" width="16" height="16" rx="1" />
  <!-- vertical divider -->
  <line x1="16" y1="8" x2="16" y2="24" />
  <!-- horizontal divider -->
  <line x1="8" y1="16" x2="24" y2="16" />
  <!-- one filled bay (top-left 8×8) -->
  <rect x="8" y="8" width="8" height="8" fill="currentColor" stroke="none" />
</svg>
