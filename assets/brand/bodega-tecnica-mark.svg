<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- refined outer shelf frame: 18×18 at 7,7 rx1.5 (tighter inset, optical 1.5px) -->
  <rect x="7" y="7" width="18" height="18" rx="1.5" />
  <!-- vertical divider centered -->
  <line x1="16" y1="7" x2="16" y2="25" />
  <!-- horizontal divider centered -->
  <line x1="7" y1="16" x2="25" y2="16" />
  <!-- one filled bay (top-left 9×9) -->
  <rect x="7" y="7" width="9" height="9" fill="currentColor" stroke="none" />
</svg>
