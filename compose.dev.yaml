# Local overlay: keep PocketBase from compose.yaml, run Next with live reload.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up
services:
  app:
    build: !reset null
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command:
      - sh
      - -c
      - corepack enable && corepack prepare pnpm@11.1.1 --activate && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 5s

volumes:
  app-node-modules:
  app-next:
