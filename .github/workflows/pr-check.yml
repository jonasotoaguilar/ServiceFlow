name: PR Validation
on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-pr-size:
    name: Check PR Cognitive Load
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR stays within review budget
        uses: actions/github-script@v9
        with:
          script: |
            const DEFAULT_LIMIT = 800;
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;
            const labels = (pr.labels || []).map(label => label.name);
            const sizeLabels = labels.filter(label => /^size:\d+$/.test(label));
            if (sizeLabels.length > 1) {
              core.setFailed(`❌ Multiple numeric size labels found: ${sizeLabels.join(', ')}. Only one size:<N> label is allowed.`);
              return;
            }
            let limit = DEFAULT_LIMIT;
            if (sizeLabels.length === 1) {
              const parsed = parseInt(sizeLabels[0].split(':')[1], 10);
              if (!Number.isFinite(parsed) || parsed <= 0) {
                core.setFailed(`❌ Invalid size label "${sizeLabels[0]}": must be a positive integer.`);
                return;
              }
              limit = parsed;
              console.log(`ℹ️ Using numeric size limit override: ${limit} (from ${sizeLabels[0]})`);
            }
            const hasException = labels.includes('size:exception');
            console.log(`PR size: +${additions} / -${deletions} = ${total} changed lines`);
            console.log(`Labels: ${labels.join(', ') || '(none)'}`);
            if (total <= limit) {
              console.log(`✅ PR is within the ${limit}-line cognitive review budget.`);
              return;
            }
            const message = `PR changes ${total} lines (+${additions}/-${deletions}), exceeding the ${limit}-line cognitive review budget.\n\nWhy: reviews should stay <60 min.\nPlease split into chained PRs or ask for size:exception.`;
            if (hasException) {
              core.warning(`⚠️ ${message}`);
              console.log('✅ size:exception label present; allowing oversized PR with warning.');
              return;
            }
            core.setFailed(`❌ ${message}`);
  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR body references an issue
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const defaultBranch = context.payload.repository.default_branch || 'main';
            const baseBranch = context.payload.pull_request.base.ref;
            const hasChain = /##\s*Chain\s*Context/i.test(body);
            const isChainChild = hasChain && baseBranch !== defaultBranch;
            const closePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const refPattern = /(?:related to|refs?|linked issue)\s+#(\d+)/gi;
            const closeMatches = [...body.matchAll(closePattern)];
            const refMatches = [...body.matchAll(refPattern)];
            const matches = isChainChild ? [...closeMatches, ...refMatches] : closeMatches;
            if (matches.length === 0) {
              core.setFailed(isChainChild ? '❌ Child PR needs Related to #<number> / Refs #<number> / Linked issue #<number> (feature-branch-chain).' : '❌ PR body must have Closes #<number> / Fixes #<number> / Resolves #<number> (tracker).');
            } else {
              const numbers = matches.map(m => `#${m[1]}`).join(', ');
              console.log(`✅ Found issue reference(s): ${numbers}`);
            }
  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check-issue-reference
    steps:
      - name: Verify linked issue(s) have status:approved label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const closePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const refPattern = /(?:related to|refs?|linked issue)\s+#(\d+)/gi;
            const matches = [...body.matchAll(closePattern), ...body.matchAll(refPattern)];
            if (matches.length === 0) {
              core.setFailed('❌ Could not find issue reference in PR body.');
              return;
            }
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];
            const failures = [];
            for (const issueNumber of issueNumbers) {
              console.log(`Checking issue #${issueNumber} for status:approved label...`);
              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`❌ Could not fetch issue #${issueNumber}: ${err.message}`);
                continue;
              }
              const labels = issue.labels.map(l => l.name);
              console.log(`Labels on issue #${issueNumber}: ${labels.join(', ') || '(none)'}`);
              if (!labels.includes('status:approved')) {
                failures.push(`❌ Issue #${issueNumber} missing status:approved. Ask maintainer to add label.`);
              } else {
                console.log(`✅ Issue #${issueNumber} has status:approved.`);
              }
            }
            if (failures.length > 0) {
              core.setFailed(failures.join('\n\n'));
            }
  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR has exactly one type:* label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const labels = pr.labels.map(l => l.name);
            const typeLabels = labels.filter(l => l.startsWith('type:'));
            console.log(`All PR labels: ${labels.join(', ') || '(none)'}`);
            console.log(`type:* labels found: ${typeLabels.join(', ') || '(none)'}`);
            if (typeLabels.length === 0) {
              core.setFailed('❌ PR needs one type:* label: type:bug, type:feature, type:refactor, type:docs, type:chore, type:breaking-change. Ask maintainer.');
            } else if (typeLabels.length > 1) {
              core.setFailed(`❌ PR has ${typeLabels.length} type:* labels: ${typeLabels.join(', ')}\nA PR must have exactly ONE type:* label. Please remove the extra one(s).`);
            } else {
              console.log(`✅ PR has type label: ${typeLabels[0]}`);
            }
